<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        textarea {
            width: 50%;
        }

        #nameContainer {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            width: 80%;
            height: 100%;
            margin: auto;
        }

        .health-box {
            width: 25%;
            height: 20%;
            border: 1px solid black;
            border-radius: 10px;
            margin: 10px;
            display: flex;
            flex-direction: column;
        }

        .health-box p {
            height: 20%;
            width: 100%;
            text-align: center;
        }

        .health-box div{
            height: 30%;
        }

        .info-box {
            display: flex;
            flex-direction: row;
            width: 100%;
        }

        .info-box button {
            width: 50%;
            border-radius: 10px;
        }

        * {
            font-size: 20px;
        }
    </style>
</head>

<body>
    <h1>Health Tracker</h1>

    <textarea name="nameInput" id="nameInput"></textarea>
    <button onclick="addNames()">Enter</button>

    <div id="nameContainer"></div>

    <script>

        const MAX = 3;
        const correct = new Audio('../sound/ding.mp3');
        const wrong = new Audio('../sound/wrong.mp3');
        const ow = new Audio('../sound/ow.mp3');
        const gameOver = new Audio('../sound/game-over-one.mp3');
        const HEART = "&#10084;&#65039;";

        function getHeart(numb) {

            if (numb <= 0) {
                return "&#128148;";
            }

            let s = "";

            for (let i = 0; i < numb; i++) {
                s += HEART;
            }

            return s;
        }

        function addNames() {
            let nameContainer = document.querySelector("#nameContainer");
            let nameText = document.querySelector("#nameInput").value;

            if (nameText == null || nameText == "") {
                return;
            }

            nameContainer.innerHTML = "";

            let nameList = nameText.split(" ");
            nameList.forEach(name => {
                let health = 3;
                let div = document.createElement("div");
                div.className = "health-box";
                // name
                let nameText = document.createElement("p");
                nameText.innerHTML = name;

                // health box
                let infoBox = document.createElement("div");
                infoBox.className = "info-box";

                // health
                let healthText = document.createElement("p");
                healthText.innerHTML = getHeart(health);


                // buttons
                let addBtn = document.createElement("button");
                addBtn.innerHTML = "+";
                let subBtn = document.createElement("button");
                subBtn.innerHTML = "-";

                // to info box
                infoBox.appendChild(addBtn);
                infoBox.appendChild(subBtn);

                // add to page
                div.appendChild(nameText);
                div.appendChild(healthText);
                div.appendChild(infoBox);

                nameContainer.appendChild(div);

                // add eventlisteners
                addBtn.addEventListener("click", () => {
                    health += 1;
                    healthText.innerHTML = getHeart(health);
                    correct.currentTime = 0;
                    correct.play();
                });

                subBtn.addEventListener("click", () => {
                    if(health <= 0){
                        return;
                    }
                    health -= 1;
                    healthText.innerHTML = getHeart(health);
                    wrong.currentTime = 0;
                    wrong.play();
                    wrong.play();
                    if(health <= 0){
                        gameOver.play();
                    }
                });
            });
        }
    </script>
</body>

</html>
